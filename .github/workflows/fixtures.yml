name: Update Fixtures

on:
  schedule:
    # TEMPORARY TEST SCHEDULE - revert to '23 7 * * 1' (Mondays 07:23 UTC) after verifying
    - cron: '47 11 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  update-fixtures:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, dom, libxml

      - name: Fetch fixtures and update WordPress
        env:
          WP_SITE_URL: ${{ secrets.WP_SITE_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          WP_PAGE_ID: ${{ secrets.WP_PAGE_ID }}
        run: php galwayfa-fixtures-standalone.php
